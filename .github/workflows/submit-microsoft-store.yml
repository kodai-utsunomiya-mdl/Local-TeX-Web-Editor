name: Prepare and submit Microsoft Store updates

on:
  workflow_run:
    workflows: ['Build Microsoft Store package', 'Build and test']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      store_run_id:
        description: 'Successful main run of Build Microsoft Store package'
        required: true
        type: string
        default: '45844360603'
      operation:
        description: 'Prepare files or submit the update to Microsoft Store'
        required: true
        type: choice
        options: [prepare, submit]
        default: prepare
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/submit-microsoft-store.yml'
      - 'scripts/prepare-store-release.mjs'
      - 'scripts/submit-microsoft-store.mjs'
      - 'tests/prepare-store-release.test.mjs'
      - 'tests/microsoft-store-submission.test.mjs'
      - 'docs/microsoft-store-automation.ja.md'
  push:
    branches: [main, automate-store-submissions]
    paths:
      - '.github/workflows/submit-microsoft-store.yml'
      - 'scripts/prepare-store-release.mjs'
      - 'scripts/submit-microsoft-store.mjs'
      - 'tests/prepare-store-release.test.mjs'
      - 'tests/microsoft-store-submission.test.mjs'
      - 'docs/microsoft-store-automation.ja.md'

permissions:
  contents: read

jobs:
  check:
    name: Check the Store submission scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test preparation and submission without Store access
        run: node --test tests/prepare-store-release.test.mjs tests/microsoft-store-submission.test.mjs

  submit:
    name: Prepare the tested release and submit when enabled
    needs: check
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: microsoft-store-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out the trusted submission code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Find the tested release and publish its Store download files
        id: files
        env:
          STORE_RUN_ID: ${{ inputs.store_run_id }}
        shell: bash
        run: |
          args=(--output store-submission-files --publish-downloads)
          if [[ -n "$STORE_RUN_ID" ]]; then args+=(--store-run "$STORE_RUN_ID"); fi
          node scripts/prepare-store-release.mjs "${args[@]}"
      - name: Prepare the package, images and listing text
        if: steps.files.outputs.ready == 'true'
        run: >-
          node scripts/submit-microsoft-store.mjs --prepare
          --package-dir store-submission-files/package
          --listing-dir store-submission-files/listing
          --metadata store-submission-files/metadata.json
          --output store-submission-files/prepared
      - name: Choose the requested operation
        if: steps.files.outputs.ready == 'true'
        id: operation
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_OPERATION: ${{ inputs.operation }}
          AUTOMATIC_SUBMISSION: ${{ vars.MICROSOFT_STORE_AUTOMATIC_SUBMISSION }}
        shell: bash
        run: |
          operation=prepare
          if [[ "$EVENT_NAME" == workflow_dispatch && "$REQUESTED_OPERATION" == submit ]]; then
            if [[ "$AUTOMATIC_SUBMISSION" != true ]]; then
              echo 'Set MICROSOFT_STORE_AUTOMATIC_SUBMISSION=true after completing account setup.' >&2
              exit 1
            fi
            operation=submit
          elif [[ "$EVENT_NAME" == workflow_run && "$AUTOMATIC_SUBMISSION" == true ]]; then
            operation=submit
          fi
          echo "operation=$operation" >> "$GITHUB_OUTPUT"
          if [[ "$operation" == prepare ]]; then
            echo 'Prepared the files. Microsoft Store submission is not enabled for this run.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Submit through the Microsoft Store API
        if: steps.operation.outputs.operation == 'submit'
        env:
          PARTNER_CENTER_TENANT_ID: ${{ secrets.PARTNER_CENTER_TENANT_ID }}
          PARTNER_CENTER_CLIENT_ID: ${{ secrets.PARTNER_CENTER_CLIENT_ID }}
          PARTNER_CENTER_CLIENT_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
        run: >-
          node scripts/submit-microsoft-store.mjs --submit
          --package-dir store-submission-files/package
          --listing-dir store-submission-files/listing
          --metadata store-submission-files/metadata.json
          --output store-submission-files/prepared
      - name: Save the preparation and submission result
        if: always() && steps.files.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-submission-${{ steps.files.outputs.tag }}
          path: |
            store-submission-files/release.json
            store-submission-files/metadata.json
            store-submission-files/prepared/
          if-no-files-found: error
          retention-days: 90
