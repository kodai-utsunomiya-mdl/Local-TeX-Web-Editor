name: Build and test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows with TeX Live and Chromium
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Node.js for the build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run editor unit tests
        run: npm run test:unit

      - name: Build the frontend
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install chromium

      - name: Test TeX setup and management screens before installing TeX
        env:
          LOCAL_TEX_EDITOR_TEST_PHASE: before-tex
        run: npm test

      - name: Embed the Windows application icon
        run: npm run build:windows-resources

      - name: Run Go tests
        run: go test ./...

      - name: Test the Windows folder and Save As dialogs
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          LOCAL_TEX_EDITOR_TEST_NATIVE_PICKER: '1'
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          go test -p 1 -count=1 -timeout 120s -v -run 'Native(Folder|Save)Picker' ./internal/platform ./internal/app 2>&1 | Tee-Object -FilePath native-folder-picker.log
          $testExitCode = $LASTEXITCODE
          Copy-Item native-folder-picker.log test-results/native-folder-picker.log
          if ($testExitCode -ne 0) { throw 'The Windows file dialog test failed.' }

      - name: Build the Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$version" -o bin/local-tex-web-editor.exe ./cmd/local-tex-editor
          if ($LASTEXITCODE -ne 0) { throw 'The Windows build failed.' }
          "LOCAL_TEX_EDITOR_TEST_EXE=$((Resolve-Path bin/local-tex-web-editor.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test the default startup setting and saved changes
        run: node scripts/test-startup.mjs

      - name: Check the version of the Windows application
        shell: pwsh
        run: |
          $expectedVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $application = (Resolve-Path 'bin/local-tex-web-editor.exe').Path
          $process = Start-Process -FilePath $application -ArgumentList '--version' -Wait -PassThru -RedirectStandardOutput 'application-version.txt' -RedirectStandardError 'application-version-error.txt'
          if ($process.ExitCode -ne 0) { throw 'The application could not report its version.' }
          $actualVersion = (Get-Content 'application-version.txt' -Raw).Trim()
          if ($actualVersion -ne $expectedVersion) { throw "The application reports $actualVersion, but the release is $expectedVersion." }
          "Verified application version: $actualVersion"

      - name: Check the icons in the Windows application
        shell: pwsh
        run: |
          $env:LOCAL_TEX_EDITOR_ICON_EXE = (Resolve-Path 'bin/local-tex-web-editor.exe').Path
          go test ./cmd/local-tex-editor -run '^TestWindowsExecutableIcon$' -count=1 -v
          if ($LASTEXITCODE -ne 0) { throw 'The Windows icon check failed.' }

      - name: Restore the previous browser tab before installing TeX
        run: npm test -- tests/startup.spec.mjs --grep "ブラウザを終了して前回のタブを復元" --output test-results/browser-session-restore

      - name: Test application updates before installing TeX
        run: npm test -- tests/application-updates.spec.mjs --output test-results/application-updates

      - name: Install TeX through the application and compile the research preambles
        run: node scripts/test-tex-setup.mjs

      - name: Download the previous release for the update test
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force test-previous | Out-Null
          gh release download v0.1.3 --repo "$env:GITHUB_REPOSITORY" --pattern 'local-tex-editor-0.1.3-windows-x64.zip' --dir test-previous
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the previous application for the update test.' }
          $archive = 'test-previous/local-tex-editor-0.1.3-windows-x64.zip'
          $expectedHash = 'd6ec47d3cee76e035dde66a94c7d65db4ffda9d8cab5b32813fff04964b68875'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) { throw 'The previous release archive did not match its recorded SHA-256.' }
          Expand-Archive -LiteralPath $archive -DestinationPath test-previous/application
          "LOCAL_TEX_EDITOR_TEST_PREVIOUS_EXE=$((Resolve-Path test-previous/application/local-tex-editor.exe).Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'LOCAL_TEX_EDITOR_TEST_PREVIOUS_VERSION=0.1.3' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test editing and compilation in the browser
        env:
          LOCAL_TEX_EDITOR_TEST_PHASE: after-tex
        run: npm test

      - name: Remove the app-managed TeX environment after the checks
        run: node scripts/test-tex-setup.mjs --remove

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Prepare the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item bin/local-tex-web-editor.exe, README.md, README.ja.md, LICENSE -Destination dist/windows
          Copy-Item docs -Destination dist/windows -Recurse -Force
          Get-FileHash dist/windows/local-tex-web-editor.exe -Algorithm SHA256 | Format-List
          $size = (Get-Item dist/windows/local-tex-web-editor.exe).Length
          "Windows application: $size bytes" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the tested Windows application
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-tex-web-editor-windows-x64
          path: dist/windows/
          if-no-files-found: error
          retention-days: 30

  macos-build:
    name: Build the universal macOS application
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CGO_ENABLED: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Node.js for the build
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies and Chromium
        run: |
          npm ci
          npx playwright install chromium

      - name: Build the frontend
        run: npm run build

      - name: Build and verify the application bundle and icon
        run: node scripts/build-macos.mjs

      - name: Upload the universal macOS archive for tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-tex-web-editor-macos-universal
          path: |
            dist/local-tex-web-editor-*-macos-universal.zip
            dist/local-tex-web-editor-*-macos-size.json
          if-no-files-found: error
          retention-days: 30

  macos:
    name: macOS ${{ matrix.architecture }} with TeX Live and Chromium
    needs: macos-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
    env:
      CGO_ENABLED: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Node.js for the tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Run editor unit tests and build test assets
        run: |
          npm run test:unit
          npm run build

      - name: Download the universal archive built by this workflow
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name local-tex-web-editor-macos-universal --dir macos-download
          version=$(node -p "require('./package.json').version")
          ditto -x -k "macos-download/local-tex-web-editor-$version-macos-universal.zip" macos-package
          echo "LOCAL_TEX_EDITOR_TEST_MAC_APP=$PWD/macos-package/Local TeX Web Editor.app" >> "$GITHUB_ENV"

      - name: Test the default startup setting and saved changes
        run: node scripts/test-startup.mjs

      - name: Install TeX through the packaged application and compile the research preambles
        run: node scripts/test-tex-setup.mjs

      - name: Run Go tests on macOS
        run: go test ./...

      - name: Install Chromium for browser tests
        run: npx playwright install chromium

      - name: Test the packaged app, editing, compilation, and shutdown
        run: node scripts/test-macos.mjs

      - name: Test automatic updates and restore the same editor
        if: matrix.architecture == 'arm64'
        run: node scripts/test-macos-update.mjs

      - name: Test the native macOS folder and Save As dialogs
        if: ${{ !cancelled() }}
        shell: bash
        env:
          LOCAL_TEX_EDITOR_TEST_NATIVE_PICKER: '1'
        run: |
          mkdir -p test-results/macos
          go test -count=1 -timeout 60s -v -run 'Native(Folder|Save)PickerMac' ./internal/platform 2>&1 | tee test-results/macos/native-folder-picker.log

      - name: Remove the app-managed TeX environment after the checks
        run: node scripts/test-tex-setup.mjs --remove

      - name: Upload macOS test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-${{ matrix.architecture }}-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish the tested application
    needs: [windows, macos]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Create a release when the version is new
        shell: bash
        env:
          APP_UPDATE_PRIVATE_KEY: ${{ secrets.APP_UPDATE_PRIVATE_KEY }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "Release $tag already exists."
            exit 0
          fi
          gh run download "$GITHUB_RUN_ID" --name local-tex-web-editor-windows-x64 --dir release-package
          archive="local-tex-web-editor-$version-windows-x64.zip"
          (cd release-package && zip -r "../$archive" .)
          gh run download "$GITHUB_RUN_ID" --name local-tex-web-editor-macos-universal --dir macos-release
          mac_archive="local-tex-web-editor-$version-macos-universal.zip"
          cp "macos-release/$mac_archive" "$mac_archive"
          sha256sum "$archive" "$mac_archive" > SHA256SUMS.txt
          node scripts/app-update-release.mjs .
          gh release create "$tag" "$archive" "$mac_archive" SHA256SUMS.txt app-update.json app-update.json.sig appcast.xml \
            --target "$GITHUB_SHA" --title "Local TeX Web Editor $version" \
            --notes-file "release-notes/$tag.md"
