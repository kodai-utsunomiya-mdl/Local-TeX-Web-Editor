name: Publish Store downloads for v0.1.15

on:
  push:
    branches: [publish-store-files-v0.1.15]
    paths: ['.github/workflows/publish-store-files-v0.1.15.yml']

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-store-files-v0.1.15
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the tested build and release
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/runs/45844360603" > tested-run.json
          gh api "repos/$GH_REPO/releases/tags/v0.1.15" > release.json
          python - <<'PY'
          import json
          from pathlib import Path
          tested = json.loads(Path('tested-run.json').read_text())
          release = json.loads(Path('release.json').read_text())
          expected = 'ffab82070c68c22917f3aba34615931119233b73'
          assert tested['conclusion'] == 'success'
          assert tested['head_sha'] == expected
          assert tested['head_branch'] == 'main'
          assert release['tag_name'] == 'v0.1.15'
          assert release['target_commitish'] == expected
          assert not release['draft']
          PY

      - name: Download the tested Store artifacts
        shell: bash
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/15132077224/zip" > submission.zip
          gh api "repos/$GH_REPO/actions/artifacts/15131772235/zip" > microsoft-store-listing.zip

      - name: Verify and publish the two requested files
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import zipfile

          archives = {
              'submission.zip': 'fa7d7bcaddce089b7543115801b4a7582a080ebd6a8d58d5dd281e83174f6730',
              'microsoft-store-listing.zip': '6d90ad64bd142ced3a65531d6bc53b2bf01002debf81795d003eb82df02ccf62',
          }
          for name, digest in archives.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name

          package = 'local-tex-web-editor-0.1.15-windows-x64.msix'
          with zipfile.ZipFile('submission.zip') as archive:
              assert archive.testzip() is None
              Path(package).write_bytes(archive.read(package))
          with zipfile.ZipFile('microsoft-store-listing.zip') as archive:
              assert archive.testzip() is None

          expected = {
              package: ('250a279e13d9c3ad534e839ef2b97f7edd10e45d56327c30a6c089f5a36b29b1', 'Microsoft Store submission package'),
              'microsoft-store-listing.zip': (archives['microsoft-store-listing.zip'], 'Microsoft Store screenshots and listing text'),
          }
          release = json.loads(Path('release.json').read_text())
          assets = {asset['name']: asset for asset in release['assets']}
          for name, (digest, label) in expected.items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == digest, name
              if name in assets:
                  assert assets[name]['digest'] == f'sha256:{digest}', name
                  print(f'Already published with the expected SHA-256: {name}')
                  continue
              subprocess.run(['gh', 'release', 'upload', 'v0.1.15', f'{name}#{label}'], check=True)
              print(f'Published: {name}')
          PY

      - name: Check out the submission automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 50fee5c5125ac663c1d2fafa9734d4ed3afdf8d9
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Prepare v0.1.15 from the published release and its tested files
        run: |
          node scripts/prepare-store-release.mjs --store-run 45844360603 --output store-submission-files --publish-downloads
          node scripts/submit-microsoft-store.mjs --prepare --package-dir store-submission-files/package --listing-dir store-submission-files/listing --metadata store-submission-files/metadata.json --output store-submission-files/prepared
      - name: Save the reviewed submission files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: store-submission-v0.1.15-review
          path: |
            store-submission-files/release.json
            store-submission-files/metadata.json
            store-submission-files/prepared/
          if-no-files-found: error
          retention-days: 90

  check-windows:
    name: Check submission automation on Windows
    runs-on: windows-2022
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the submission automation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: 50fee5c5125ac663c1d2fafa9734d4ed3afdf8d9
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Test the submission scripts with the Windows checkout
        run: node --test tests/prepare-store-release.test.mjs tests/microsoft-store-submission.test.mjs
