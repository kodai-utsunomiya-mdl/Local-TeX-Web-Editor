name: Build Microsoft Store package

on:
  push:
    branches: [main, prepare-microsoft-store]
    paths:
      - '.github/workflows/microsoft-store.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'packaging/windows/**'
      - 'scripts/build-msix.mjs'
      - 'scripts/test-msix*'
      - 'scripts/build*.mjs'
      - 'package*.json'
      - 'go.mod'
      - 'docs/microsoft-store*'
      - 'docs/privacy*'
      - 'docs/screenshots/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microsoft-store-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msix:
    name: Install and test the Windows MSIX
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      CGO_ENABLED: '0'
      CTAN_REPO: https://mirror.ctan.org/systems/texlive/tlnet
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Build the editor and run unit tests
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'Could not install build dependencies.' }
          npm run test:unit
          if ($LASTEXITCODE -ne 0) { throw 'The editor unit tests failed.' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'The editor build failed.' }
          npm run build:windows-resources
          if ($LASTEXITCODE -ne 0) { throw 'Could not embed the Windows icons.' }
          go test ./...
          if ($LASTEXITCODE -ne 0) { throw 'The Go tests failed.' }
          New-Item -ItemType Directory -Force bin | Out-Null
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          go build -trimpath -ldflags="-s -w -H=windowsgui -X main.version=$version" -o bin/local-tex-web-editor.exe ./cmd/local-tex-editor
          if ($LASTEXITCODE -ne 0) { throw 'The Windows build failed.' }

      - name: Install Chromium for package assets and browser tests
        run: npx playwright install chromium

      - name: Create a package with the test identity
        run: node scripts/build-msix.mjs --test-identity

      - name: Set up TeX Live
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2

      - name: Install TeX packages for compilation and SyncTeX
        shell: pwsh
        run: |
          tlmgr update --self
          if ($LASTEXITCODE -ne 0) { throw 'Could not update the TeX package manager.' }
          tlmgr install latexmk uptex uptex-base uplatex platex jsclasses dvipdfmx synctex natbib ptex-fonts ptex-fontmaps haranoaji adobemapping
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the TeX packages.' }
          fmtutil-sys --byfmt uplatex
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the upLaTeX format.' }
          updmap-sys --setoption kanjiEmbed haranoaji
          if ($LASTEXITCODE -ne 0) { throw 'Could not configure the Japanese fonts.' }
          $texBin = Split-Path -Parent (Get-Command uplatex.exe).Source
          "LOCAL_TEX_EDITOR_TEST_TEX_BIN=$texBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install, launch and test the MSIX application
        # The Appx deployment module uses Windows PowerShell and .NET Framework.
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          ./scripts/test-msix.ps1 -PackagePath "dist/local-tex-web-editor-$version-windows-x64.msix"

      - name: Read the Microsoft Store Product identity
        id: identity
        shell: pwsh
        run: |
          $identity = Get-Content packaging/windows/store-identity.json -Raw | ConvertFrom-Json
          $values = @(
            $(if ($env:MSIX_IDENTITY_NAME) { $env:MSIX_IDENTITY_NAME } else { $identity.identityName }),
            $(if ($env:MSIX_PUBLISHER) { $env:MSIX_PUBLISHER } else { $identity.publisher }),
            $(if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $env:MSIX_PUBLISHER_DISPLAY_NAME } else { $identity.publisherDisplayName })
          )
          $present = @($values | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }).Count
          if ($present -ne 0 -and $present -ne 3) { throw 'Complete all three Product identity values before creating the submission package.' }
          if ($present -eq 3) {
            'configured=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            'configured=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            'The MSIX installation test has passed. Add the three Product identity values from Partner Center to create the Store submission package.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

      - name: Create the package for Store submission
        if: steps.identity.outputs.configured == 'true'
        run: node scripts/build-msix.mjs

      - name: Prepare listing screenshots after package creation
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $listing = 'dist/store-listing'
          if (-not (Test-Path -LiteralPath $listing -PathType Container)) {
            Write-Host 'The package build did not produce listing files.'
            exit 0
          }
          $images = @('editor-tex-dark.png', 'editor-markdown-light.png')
          $captured = @($images | ForEach-Object { Join-Path 'test-results/msix' $_ })
          $missing = @($captured | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) })
          if ($missing.Count -eq 0) {
            Copy-Item -LiteralPath $captured -Destination $listing -Force
            $source = 'installed-msix'
            $note = 'The listing artifact contains both screenshots captured from the MSIX application installed in this run.'
          } else {
            $fallback = @($images | ForEach-Object { Join-Path 'docs/screenshots' $_ })
            Copy-Item -LiteralPath $fallback -Destination $listing -Force
            $source = 'docs/screenshots'
            $note = 'The listing artifact contains repository screenshots because both installed-app captures were not available. Use the images from a successful installed-package run when submitting to Store.'
          }
          @{ source = $source; files = $images; note = $note } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $listing 'screenshot-source.json') -Encoding utf8
          $note | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload the package for Store submission
        if: steps.identity.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-submission
          path: |
            dist/local-tex-web-editor-*-windows-x64.msix
            dist/msix-package.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Store descriptions and images
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-listing
          path: dist/store-listing/
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: microsoft-store-test-results
          path: test-results/msix/
          if-no-files-found: ignore
          retention-days: 14
